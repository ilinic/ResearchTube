<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 0; overflow: hidden; }
    body { margin: 0; padding: 0; color: CanvasText; background: transparent; }
    .capture { width: 100%; min-width: 0; padding: 42px 48px 54px; display: grid; gap: 18px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
    .brand-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 9px; background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 1px 3px rgb(0 0 0 / 28%); }
    .brand-mark svg { width: 18px; height: 18px; fill: white; }
    .brand-name { font-weight: 700; font-size: 15px; line-height: 1.1; letter-spacing: .01em; }
    .brand-subtitle { margin-top: 2px; color: color-mix(in srgb, CanvasText 62%, Canvas); font-size: 12px; line-height: 1.2; }
    .status { min-height: 1.3em; color: color-mix(in srgb, CanvasText 68%, Canvas); font-size: 13px; line-height: 1.4; }
    .status.error { color: #d92d20; }
    .status-title { font-weight: 650; }
    .status-detail { margin-top: 2px; }
    .media { display: flex; align-items: flex-start; justify-content: flex-start; gap: 9px; min-width: 0; }
    canvas { display: none; max-width: 100%; max-height: 560px; width: auto; height: auto; border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas); border-radius: 10px; background: color-mix(in srgb, CanvasText 8%, Canvas); box-shadow: 0 1px 3px rgb(0 0 0 / 18%); }
    .media-actions { display: none; flex: 0 0 auto; flex-direction: column; gap: 7px; }
    .media-actions.visible { display: flex; }
    .icon-button { display: inline-grid; width: 31px; height: 31px; padding: 0; place-items: center; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 8px; color: CanvasText; background: color-mix(in srgb, CanvasText 5%, Canvas); cursor: pointer; }
    .icon-button:hover { background: color-mix(in srgb, CanvasText 12%, Canvas); }
    .icon-button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
    .icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .header-action { position: relative; }
    .header-action svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .details { display: none; min-width: 0; padding-top: 2px; }
    .details.visible { display: grid; gap: 9px; padding-bottom: 3px; }
    .path-label { color: color-mix(in srgb, CanvasText 60%, Canvas); font-size: 11px; font-weight: 650; letter-spacing: .045em; text-transform: uppercase; }
    .path-row { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
    .path { min-width: 0; flex: 1 1 auto; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }
    .path-row .icon-button { width: 29px; height: 29px; flex: 0 0 auto; }
    .metadata { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { padding: 3px 7px; border: 1px solid color-mix(in srgb, CanvasText 17%, Canvas); border-radius: 999px; color: color-mix(in srgb, CanvasText 76%, Canvas); font-size: 11px; line-height: 1.25; }
  </style>
</head>
<body>
  <main class="capture">
    <header class="brand">
      <div class="brand-identity"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.4v13.2c0 .8.9 1.3 1.6.8l10-6.6a1 1 0 0 0 0-1.6l-10-6.6A1 1 0 0 0 8 5.4Z"/></svg></span>
        <div><div class="brand-name">ResearchTube</div><div class="brand-subtitle">Captured video frame</div></div></div>
      <button id="refresh-frame" class="icon-button header-action" type="button" title="Refresh frame" aria-label="Refresh frame"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-2.2 -2.26)"><path d="M20 11a8 8 0 1 0 2.2 5.5"/><path d="M20 4v7h-7"/></g></svg></button>
    </header>
    <div id="status" class="status" role="status">
      <div id="status-title" class="status-title">Loading captured frame…</div>
      <div id="status-detail" class="status-detail" hidden></div>
    </div>
    <div class="media">
      <canvas id="image" aria-label="Captured video frame"></canvas>
      <div id="media-actions" class="media-actions" aria-label="Image actions">
        <button id="copy-image" class="icon-button" type="button" title="Copy image" aria-label="Copy image"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="1"/><path d="M15 9V6a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3"/></svg></button>
        <button id="download-image" class="icon-button" type="button" title="Download image" aria-label="Download image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></button>
      </div>
    </div>
    <section id="details" class="details" aria-label="Captured frame details">
      <div class="path-label">Workspace file</div>
      <div class="path-row"><div id="path" class="path"></div><button id="copy-path" class="icon-button" type="button" title="Copy workspace path" aria-label="Copy workspace path"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="1"/><path d="M15 9V6a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3"/></svg></button></div>
      <div id="metadata" class="metadata"></div>
    </section>
  </main>
  <script>
    (() => {
      const status = document.getElementById("status");
      const statusTitle = document.getElementById("status-title");
      const statusDetail = document.getElementById("status-detail");
      const image = document.getElementById("image");
      const mediaActions = document.getElementById("media-actions");
      const copyImageButton = document.getElementById("copy-image");
      const downloadImageButton = document.getElementById("download-image");
      const refreshFrameButton = document.getElementById("refresh-frame");
      const details = document.getElementById("details");
      const pathElement = document.getElementById("path");
      const copyPathButton = document.getElementById("copy-path");
      const metadataElement = document.getElementById("metadata");
      let lastWorkspacePath = null;
      let loadedImage = null;

      const openai = () => window.openai;
      function reportIntrinsicHeight() {
        requestAnimationFrame(() => {
          const height = Math.ceil(document.documentElement.scrollHeight);
          const notify = openai()?.notifyIntrinsicHeight;
          if (typeof notify !== "function") return;
          // ChatGPT hosts have used both a no-argument form and a height
          // argument. Calling both is idempotent and keeps this plain widget
          // compatible with either bridge implementation.
          try { notify(); } catch (_error) { /* Try the height form below. */ }
          try { notify({ height }); } catch (_error) { /* The host cannot resize this view. */ }
        });
      }
      function displayStatus(title, isError = false, detail = null) {
        statusTitle.textContent = title;
        statusDetail.textContent = detail || "";
        statusDetail.hidden = !detail;
        status.classList.toggle("error", isError);
        reportIntrinsicHeight();
      }
      function baseName(path) {
        return String(path || "ResearchTube frame.png").split("/").pop() || "ResearchTube frame.png";
      }
      function base64ToBlob(base64, mimeType) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        return new Blob([bytes], { type: mimeType });
      }
      function setImageActionsVisible(visible) { mediaActions.classList.toggle("visible", visible); }
      async function callWidgetAction(toolName, workspacePath) {
        if (typeof openai()?.callTool !== "function") throw new Error("This ChatGPT host does not expose the MCP Apps tool-call bridge.");
        return openai().callTool(toolName, { path: workspacePath });
      }
      async function copyImage() {
        if (!loadedImage) throw new Error("No image is available to copy.");
        await callWidgetAction("researchtube_copy_capture_frame_image", loadedImage.workspacePath);
        displayStatus("Image copied to the local clipboard.");
      }
      async function copyPath() {
        const workspacePath = loadedImage?.workspacePath ?? lastWorkspacePath;
        if (!workspacePath) throw new Error("No workspace path is available to copy.");
        await callWidgetAction("researchtube_copy_capture_frame_path", workspacePath);
        displayStatus("Workspace path copied to the local clipboard.");
      }
      async function downloadImage() {
        if (!loadedImage) throw new Error("No image is available to download.");
        await callWidgetAction("researchtube_download_capture_frame", loadedImage.workspacePath);
        displayStatus("Chrome opened the image download.");
      }
      async function runImageAction(action, failureTitle) {
        try { await action(); }
        catch (error) {
          console.warn("[ResearchTube] captured-frame widget action failed", error);
          displayStatus(failureTitle, true, "The image is still available in the workspace.");
        }
      }
      function findCaptureBase64(value, visited = new Set()) {
        if (!value || typeof value !== "object" || visited.has(value)) return null;
        visited.add(value);
        if (typeof value.captureFrameImageBase64 === "string") return value.captureFrameImageBase64;
        for (const nested of Object.values(value)) {
          const found = findCaptureBase64(nested, visited);
          if (found) return found;
        }
        return null;
      }
      async function callImageTool(workspacePath) {
        if (typeof openai()?.callTool === "function") return openai().callTool("researchtube_get_capture_frame_image", { path: workspacePath });
        throw new Error("This ChatGPT host does not expose the MCP Apps tool-call bridge.");
      }
      function widgetToolMetadata() { return openai()?.toolResponseMetadata ?? null; }
      function normalizedOutput(value) {
        if (value?.structuredContent) return value.structuredContent;
        return value && typeof value === "object" ? value : null;
      }
      function formatBytes(value) {
        if (!Number.isFinite(value) || value < 0) return null;
        if (value < 1024) return `${value} B`;
        if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
        return `${(value / (1024 * 1024)).toFixed(1)} MB`;
      }
      function addChip(text) {
        if (!text) return;
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = text;
        metadataElement.append(chip);
      }
      function showDetails(frame, fallbackPath, fallbackMimeType) {
        const frameImage = frame?.image ?? {};
        const workspacePath = frameImage.workspacePath ?? fallbackPath;
        if (typeof workspacePath !== "string") return;
        pathElement.textContent = workspacePath;
        metadataElement.replaceChildren();
        if (Number.isInteger(frameImage.width) && Number.isInteger(frameImage.height)) addChip(`${frameImage.width} × ${frameImage.height}`);
        const format = typeof frameImage.format === "string" ? frameImage.format.toUpperCase() : String(fallbackMimeType || "").replace("image/", "").toUpperCase();
        addChip(format || null);
        addChip(formatBytes(frameImage.imageSizeBytes));
        if (Number.isFinite(frame?.requestedTimestampSeconds)) addChip(`t = ${frame.requestedTimestampSeconds.toFixed(3)} s`);
        if (typeof frame?.seekMode === "string") addChip(`${frame.seekMode} seek`);
        details.classList.add("visible");
        reportIntrinsicHeight();
      }
      function friendlyLoadError(error) {
        const raw = String(error?.message || error || "");
        console.warn("[ResearchTube] captured-frame widget load failed", error);
        if (/FILE_NOT_FOUND|requested workspace file does not exist|does not exist/i.test(raw)) {
          return { title: "Captured frame unavailable", detail: "The workspace image is no longer available. It may have been moved or deleted." };
        }
        if (/AGENT_UNAVAILABLE|ECONNREFUSED|Failed to fetch|NetworkError|network/i.test(raw)) {
          return { title: "Captured frame unavailable", detail: "The Local Agent is unavailable. Start it and refresh this frame." };
        }
        return { title: "Captured frame unavailable", detail: "Check the Local Agent and workspace image file." };
      }
      async function maybeSaveToLibrary(frame, base64) {
        if (!frame.image.saveToLibrary || typeof openai()?.uploadFile !== "function") return null;
        const current = openai().widgetState;
        const saved = current?.privateContent;
        if (saved?.workspacePath === frame.image.workspacePath && typeof saved.libraryFileId === "string") return saved.libraryFileId;
        const file = new File([base64ToBlob(base64, frame.image.mimeType)], baseName(frame.image.workspacePath), { type: frame.image.mimeType });
        const { fileId } = await openai().uploadFile(file, { library: true });
        if (typeof fileId !== "string" || !fileId) throw new Error("ChatGPT Library did not return a file ID.");
        await openai().setWidgetState?.({
          modelContent: { sourcePath: frame.sourcePath, workspacePath: frame.image.workspacePath, libraryFileName: file.name, imageAvailableToModel: true },
          privateContent: { workspacePath: frame.image.workspacePath, libraryFileId: fileId, mimeType: frame.image.mimeType },
          imageIds: [fileId]
        });
        return fileId;
      }
      async function paintFrame(base64, mimeType) {
        if (typeof createImageBitmap !== "function") throw new Error("This ChatGPT widget host cannot decode an image bitmap.");
        const bitmap = await createImageBitmap(base64ToBlob(base64, mimeType));
        try {
          image.width = bitmap.width;
          image.height = bitmap.height;
          const context = image.getContext("2d");
          if (!context) throw new Error("This ChatGPT widget host cannot create a canvas context.");
          context.drawImage(bitmap, 0, 0);
          image.style.display = "block";
        } finally { bitmap.close?.(); }
      }
      async function render(frame) {
        const workspacePath = frame?.image?.workspacePath;
        const mimeType = frame?.image?.mimeType;
        if (typeof workspacePath !== "string" || typeof mimeType !== "string") return;
        if (workspacePath === lastWorkspacePath && image.width > 0) return;
        lastWorkspacePath = workspacePath;
        loadedImage = null;
        image.style.display = "none";
        setImageActionsVisible(false);
        displayStatus("Loading captured frame…");
        showDetails(frame, workspacePath, mimeType);
        try {
          const response = await callImageTool(workspacePath);
          const base64 = findCaptureBase64(widgetToolMetadata()) ?? findCaptureBase64(response);
          const metadata = normalizedOutput(response);
          if (!base64) throw new Error("The Local Agent did not return image data to the widget.");
          const actualMimeType = metadata?.mimeType || mimeType;
          await paintFrame(base64, actualMimeType);
          loadedImage = { base64, mimeType: actualMimeType, workspacePath };
          const libraryFileId = await maybeSaveToLibrary(frame, base64);
          if (libraryFileId) loadedImage.libraryFileId = libraryFileId;
          if (!libraryFileId) await openai()?.setWidgetState?.({
            privateContent: { workspacePath, mimeType: actualMimeType },
            modelContent: { sourcePath: frame.sourcePath, workspacePath, imageAvailableToModel: false }, imageIds: []
          });
          // A tool call can be rejected by ChatGPT while a previous
          // setWidgetState request is still in flight. Do not expose actions
          // until that state write has settled.
          setImageActionsVisible(true);
          displayStatus(libraryFileId ? "Saved to ChatGPT Library." : "Frame loaded.");
        } catch (error) {
          const message = friendlyLoadError(error);
          displayStatus(message.title, true, message.detail);
        }
      }
      function renderCurrent() {
        const state = openai()?.widgetState;
        const output = openai()?.toolOutput ?? state?.modelContent;
        if (output?.image?.workspacePath) return render(output);
        if (state?.privateContent?.workspacePath) return render({ sourcePath: state?.modelContent?.sourcePath ?? null, image: {
          workspacePath: state.privateContent.workspacePath, mimeType: state.privateContent.mimeType ?? "image/png", width: null, height: null, saveToLibrary: false
        }});
      }
      async function refreshCurrent() {
        lastWorkspacePath = null;
        loadedImage = null;
        image.style.display = "none";
        setImageActionsVisible(false);
        const state = openai()?.widgetState;
        const output = openai()?.toolOutput ?? state?.modelContent;
        if (output?.image?.workspacePath) return render(output);
        if (state?.privateContent?.workspacePath) return render({ sourcePath: state?.modelContent?.sourcePath ?? null, image: {
          workspacePath: state.privateContent.workspacePath, mimeType: state.privateContent.mimeType ?? "image/png", width: null, height: null, saveToLibrary: false
        }});
        displayStatus("Captured frame unavailable", true, "Check the Local Agent and workspace image file.");
      }
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0" || message.method !== "ui/notifications/tool-result") return;
        void render(message.params?.structuredContent);
      }, { passive: true });
      window.addEventListener("openai:set_globals", (event) => {
        const output = event?.detail?.globals?.toolOutput;
        if (output?.image?.workspacePath) void render(output);
        else void renderCurrent();
      }, { passive: true });
      if (typeof ResizeObserver === "function") {
        new ResizeObserver(() => reportIntrinsicHeight()).observe(document.body);
      }
      copyImageButton.addEventListener("click", () => { void runImageAction(copyImage, "Could not copy image."); });
      copyPathButton.addEventListener("click", () => { void runImageAction(copyPath, "Could not copy workspace path."); });
      downloadImageButton.addEventListener("click", () => { void runImageAction(downloadImage, "Could not start image download."); });
      refreshFrameButton.addEventListener("click", () => { void refreshCurrent(); });
      renderCurrent();
    })();
  </script>
</body>
</html>

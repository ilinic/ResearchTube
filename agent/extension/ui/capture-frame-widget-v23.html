<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; } html, body { width: 100%; min-width: 0; overflow: hidden; }
    body { margin: 0; color: CanvasText; background: transparent; }
    .capture { width: 100%; padding: 26px 32px 34px; display: grid; gap: 12px; }
    .brand, .path-row, .info-row { display: flex; align-items: center; min-width: 0; }
    .brand { justify-content: space-between; gap: 12px; }
    .brand-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 9px; background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .brand-mark svg { width: 18px; height: 18px; fill: white; }
    .brand-copy { min-width: 0; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }.brand-name { font-weight: 750; }.brand-context, .status { color: color-mix(in srgb, CanvasText 66%, Canvas); }
    button { font: inherit; color: CanvasText; cursor: pointer; }.icon-button { display: inline-grid; width: 31px; height: 31px; flex: 0 0 auto; padding: 0; place-items: center; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 8px; background: color-mix(in srgb, CanvasText 5%, Canvas); }.icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .details { display: none; min-width: 0; }.details.visible { display: block; }.path-row { gap: 8px; }.path { min-width: 0; flex: 1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }.youtube-video-link, .public-link { color: #3b82f6; text-decoration: underline; text-underline-offset: 2px; }
    .info-row { align-items: flex-start; flex-wrap: wrap; gap: 8px 10px; }.status { min-width: 0; font-size: 13px; line-height: 1.4; }.status.error { width: 100%; color: #d92d20; }.metadata { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 7px; }.chip { padding: 3px 7px; border: 1px solid color-mix(in srgb, CanvasText 17%, Canvas); border-radius: 999px; color: color-mix(in srgb, CanvasText 76%, Canvas); font-size: 11px; line-height: 1.25; }
    canvas { display: none; max-width: 100%; max-height: 560px; width: auto; height: auto; border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas); border-radius: 10px; background: color-mix(in srgb, CanvasText 8%, Canvas); box-shadow: 0 1px 3px rgb(0 0 0 / 18%); }
  </style>
</head>
<body>
  <main class="capture">
    <header class="brand"><div class="brand-identity"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.4v13.2c0 .8.9 1.3 1.6.8l10-6.6a1 1 0 0 0 0-1.6l-10-6.6A1 1 0 0 0 8 5.4Z"/></svg></span><div class="brand-copy"><span class="brand-name">ResearchTube</span><span class="brand-context"> — captured video frame in workspace</span></div></div><button id="refresh-frame" class="icon-button" type="button" title="Refresh frame" aria-label="Refresh frame"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2.2 5.5"/><path d="M20 4v7h-7"/></svg></button></header>
    <section id="details" class="details"><div class="path-row"><div id="path" class="path"></div></div><a id="public-url" class="public-link" target="_blank" rel="noreferrer">Public image URL</a></section>
    <div class="info-row"><div id="status" class="status" role="status">Loading captured frame…</div><div id="metadata" class="metadata"></div></div>
    <canvas id="image" aria-label="Captured video frame"></canvas>
  </main>
  <script>
    (() => {
      const openai = () => window.openai; const image = document.getElementById("image"); const status = document.getElementById("status"); const details = document.getElementById("details"); const pathElement = document.getElementById("path"); const metadata = document.getElementById("metadata"); const publicUrl = document.getElementById("public-url"); let lastWorkspacePath = null;
      const reportHeight = () => requestAnimationFrame(() => { try { openai()?.notifyIntrinsicHeight?.({ height: Math.ceil(document.documentElement.scrollHeight) }); } catch (_error) {} });
      const setStatus = (text, error = false) => { status.textContent = text; status.classList.toggle("error", error); reportHeight(); };
      const widgetMetadata = () => openai()?.toolResponseMetadata ?? null;
      function findCaptureBase64(value, visited = new Set()) { if (!value || typeof value !== "object" || visited.has(value)) return null; visited.add(value); if (typeof value.captureFrameImageBase64 === "string") return value.captureFrameImageBase64; if (typeof value.inlineImageBase64 === "string") return value.inlineImageBase64; for (const nested of Object.values(value)) { const found = findCaptureBase64(nested, visited); if (found) return found; } return null; }
      async function callImageTool(path) { if (typeof openai()?.callTool !== "function") throw new Error("This ChatGPT host does not expose the MCP Apps tool-call bridge."); return openai().callTool("researchtube_get_capture_frame_image", { path }); }
      function renderPath(path) { const fragment = document.createDocumentFragment(); let cursor = 0; for (const match of path.matchAll(/\[yt_([A-Za-z0-9_-]{6,})\]/g)) { fragment.append(document.createTextNode(path.slice(cursor, match.index))); const link = document.createElement("a"); const href = `https://www.youtube.com/watch?v=${encodeURIComponent(match[1])}`; link.className = "youtube-video-link"; link.href = href; link.target = "_blank"; link.rel = "noreferrer"; link.textContent = match[0]; link.title = "Open source video on YouTube"; fragment.append(link); cursor = match.index + match[0].length; } fragment.append(document.createTextNode(path.slice(cursor))); pathElement.replaceChildren(fragment); }
      function addChip(text) { if (!text) return; const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = text; metadata.append(chip); }
      function showDetails(frame, info) { renderPath(info.workspacePath); publicUrl.href = info.publicUrl; metadata.replaceChildren(); if (Number.isFinite(frame.requestedTimestampSeconds)) addChip(`t = ${frame.requestedTimestampSeconds.toFixed(3)} s`); if (Number.isInteger(info.width) && Number.isInteger(info.height)) addChip(`${info.width} × ${info.height}`); addChip(String(info.format || "").toUpperCase()); if (Number.isInteger(info.imageSizeBytes)) addChip(`${Math.round(info.imageSizeBytes / 1024)} KB`); if (typeof frame.seekMode === "string") addChip(`${frame.seekMode} seek`); details.classList.add("visible"); reportHeight(); }
      async function paintFrame(base64, mimeType) { const binary = atob(base64); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i); const bitmap = await createImageBitmap(new Blob([bytes], { type: mimeType })); try { image.width = bitmap.width; image.height = bitmap.height; const context = image.getContext("2d"); if (!context) throw new Error("Canvas is unavailable."); context.drawImage(bitmap, 0, 0); image.style.display = "block"; } finally { bitmap.close?.(); } reportHeight(); }
      async function render(frame, force = false) { const info = frame?.image; if (!info || typeof info.workspacePath !== "string" || typeof info.mimeType !== "string") return; if (!force && info.workspacePath === lastWorkspacePath && image.width > 0) return; lastWorkspacePath = info.workspacePath; image.style.display = "none"; showDetails(frame, info); setStatus("Loading captured frame…"); try { const response = await callImageTool(info.workspacePath); const bytes = findCaptureBase64(widgetMetadata()) ?? findCaptureBase64(response); if (!bytes) throw new Error("The Local Agent did not return image data to the widget."); await paintFrame(bytes, info.mimeType); setStatus("Frame loaded."); } catch (error) { console.warn("[ResearchTube] captured-frame preview failed", error); setStatus(error instanceof Error ? error.message : "Could not load captured frame.", true); } }
      const currentFrame = () => openai()?.toolOutput ?? openai()?.widgetState?.modelContent;
      document.getElementById("refresh-frame").addEventListener("click", () => { lastWorkspacePath = null; void render(currentFrame(), true); });
      window.addEventListener("openai:set_globals", event => void render(event?.detail?.globals?.toolOutput ?? currentFrame())); window.addEventListener("message", event => { if (event.source === window.parent && event.data?.method === "ui/notifications/tool-result") void render(event.data.params?.structuredContent); });
      if (typeof ResizeObserver === "function") new ResizeObserver(reportHeight).observe(document.body); render(currentFrame());
    })();
  </script>
</body>
</html>

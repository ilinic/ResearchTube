name: Collect ResearchTube statistics

on:
  schedule:
    # Daily at 02:35 UTC; scheduled runs can be delayed by GitHub.
    - cron: "35 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: researchtube-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Collect GitHub traffic, releases, and popularity
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TRAFFIC_STATS_TOKEN: ${{ secrets.GH_TRAFFIC_STATS_TOKEN }}
        run: python3 scripts/collect_github_stats.py

      - name: Commit statistics to main
        run: |
          if [[ ! -f stats/history.json ]]; then
            echo "::error::Statistics collector did not generate stats/history.json"
            exit 1
          fi
          git add stats/history.json
          if git diff --cached --quiet; then
            echo "No statistics changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(stats): record GitHub activity snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

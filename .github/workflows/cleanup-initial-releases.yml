name: Clean up initial ResearchTube releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-initial-releases.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove obsolete initial releases and highlight the user download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['RELEASE_REPOSITORY']
          if repo != 'ilinic/ResearchTube':
              raise RuntimeError('This one-time cleanup is only for ilinic/ResearchTube.')

          def api(path, *args):
              result = subprocess.run(['gh', 'api', f'repos/{repo}/{path}', *args],
                                      capture_output=True, text=True, timeout=60)
              if result.returncode:
                  raise RuntimeError(result.stderr.strip())
              return json.loads(result.stdout) if result.stdout.strip() else None

          current = api('releases/407395198')
          if current['tag_name'] != 'ext-2.2.103_agent-2.2.71' or current['draft']:
              raise RuntimeError('Current user release differs from the inspected release.')
          before = [(a['id'], a['name'], a['size'], a.get('digest')) for a in current['assets']]
          if sorted(a['name'] for a in current['assets']) != ['ResearchTube.zip', 'ResearchTube.zip.sha256']:
              raise RuntimeError('Current release assets differ from the inspected assets.')
          url = f"https://github.com/{repo}/releases/download/{current['tag_name']}/ResearchTube.zip"
          body = current['body']
          if not body.startswith('**[Download ResearchTube.zip]'):
              body = f'**[Download ResearchTube.zip]({url})**\n\n' + body
          body = body.replace('Download **ResearchTube.zip** from Assets and extract the complete archive.',
                              'Extract the complete archive.')
          body = body.replace('the Windows Agent EXE, Python sources for Windows/Linux/macOS',
                              'the Agent (Windows EXE and Python launch mode for Linux/macOS)')
          api('releases/407395198', '--method', 'PATCH', '--raw-field', 'body=' + body)

          for release_id, tag, expected_draft in (
              (407392021, 'ext-2.2.102_agent-2.2.71', False),
              (407389767, 'ext-2.2.101_agent-2.2.71', True),
          ):
              release = api(f'releases/{release_id}')
              if release['tag_name'] != tag or release['draft'] != expected_draft:
                  raise RuntimeError('Obsolete release differs from the inspected release.')
              api(f'releases/{release_id}', '--method', 'DELETE')
              print('Deleted release: ' + tag)

          after = api('releases/407395198')
          if [(a['id'], a['name'], a['size'], a.get('digest')) for a in after['assets']] != before:
              raise RuntimeError('The current user archive changed unexpectedly.')
          print('Preserved current user release and its archive: ' + after['html_url'])
          PY

name: Build shared Python and Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'scripts/**'
      - '.github/workflows/build-release.yml'
permissions:
  contents: read
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build and Windows speech dependencies
        run: python -m pip install -r agent/requirements-build.txt
      - name: Build shared ZIP
        run: python scripts/build_release.py
      - name: Test Python and EXE from the extracted ZIP
        run: python scripts/smoke_agent.py --zip dist/ResearchTube.zip --windows-speech
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchTube-shared-release
          path: dist/ResearchTube.zip
          if-no-files-found: error
          retention-days: 30

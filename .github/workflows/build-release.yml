name: Build and publish ResearchTube release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'extension/**'
      - 'docs/**'
      - 'icons/**'
      - 'README.md'
      - 'release.json'
      - 'scripts/**'
      - '.github/workflows/build-release.yml'
permissions:
  contents: read
concurrency:
  group: researchtube-release
  cancel-in-progress: false
jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build and Windows speech dependencies
        run: python -m pip install -r agent/requirements-build.txt
      - name: Test release publication behavior
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check packaged component versions
        run: node extension/tests/release-version-consistency.test.mjs
      - name: Build shared ZIP
        run: python scripts/build_release.py
      - name: Test Python and EXE from the extracted ZIP
        run: python scripts/smoke_agent.py --zip dist/ResearchTube.zip --windows-speech
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchTube-shared-release
          path: dist/ResearchTube.zip
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: windows-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ResearchTube-shared-release
          path: dist
      - name: Publish version pair to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/publish_release.py --zip dist/ResearchTube.zip --repo "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"

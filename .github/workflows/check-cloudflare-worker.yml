name: Check Cloudflare Worker

on:
  push:
    paths:
      - 'cloudflare-worker/**'
      - 'extension/**'
      - '.github/workflows/check-cloudflare-worker.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'extension/**'
      - '.github/workflows/check-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            cloudflare-worker/package-lock.json
      - run: npm ci --prefix extension
      - run: npm run build --prefix extension
      - run: npm ci --prefix cloudflare-worker
      - run: npm run check --prefix cloudflare-worker
      - run: npm test --prefix cloudflare-worker

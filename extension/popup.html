<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ResearchTube</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><img src="icons/researchtube-32.png" alt=""><div><h1>ResearchTube</h1><p>Turn YouTube into Answers</p></div></header>
  <hr class="section-divider">
  <section class="quick-actions"><button id="describe-video" hidden>Describe this video</button><button id="chatgpt" class="secondary">Study this site</button><p id="describe-video-status" class="action-status" hidden></p></section>
  <section id="browser-session" hidden aria-label="Browser Agent"><strong>Browser Agent</strong><p id="browser-session-status" aria-live="polite"></p><div class="browser-controls"><button id="browser-pause" class="secondary">Pause</button><button id="browser-resume" class="secondary">Resume</button><button id="browser-stop" class="secondary">Stop</button></div></section>
  <dl><div><dt>Extension</dt><dd id="extension-status">—</dd></div><div><dt>OpenAI Tunnel</dt><dd id="tunnel-status">—</dd></div><div><dt>YouTube</dt><dd id="youtube-status">—</dd></div><div class="agent-group-start"><dt>Local Agent</dt><dd id="agent-status">—</dd></div><div><dt>Interface</dt><dd id="interface-version">—</dd></div><div><dt>Silent file automation</dt><dd id="chrome-automation-status">—</dd></div></dl>
  <hr class="section-divider">
  <nav><button id="settings" class="link">Settings</button><button id="support" class="link support-link"><span class="support-heart" aria-hidden="true">♥</span> Support</button></nav>
</main><script src="popup.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; } html, body { width: 100%; height: 100%; margin: 0; }
    body { color: CanvasText; background: Canvas; } main { min-height: 100%; padding: 20px 24px 26px; display: grid; align-content: start; gap: 10px; }
    header { display: flex; align-items: center; gap: 8px; min-width: 0; } #kind { font-size: 14px; color: color-mix(in srgb, CanvasText 76%, Canvas); } #status { min-width: 0; font-size: 13px; color: color-mix(in srgb, CanvasText 66%, Canvas); } #status.error { color: #d92d20; }
    .actions { display: flex; gap: 7px; margin-left: auto; } button { display: grid; width: 31px; height: 31px; place-items: center; padding: 0; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 8px; background: color-mix(in srgb, CanvasText 5%, Canvas); color: CanvasText; cursor: pointer; } button:disabled { cursor: progress; opacity: .7; }
    #path { min-width: 0; overflow-wrap: anywhere; word-break: break-word; font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    #image, #video, #audio { display: none; max-width: 100%; border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas); border-radius: 10px; background: color-mix(in srgb, CanvasText 8%, Canvas); box-shadow: 0 1px 3px rgb(0 0 0 / 18%); }
    #image, #video { max-height: 560px; width: auto; height: auto; } #audio { width: min(560px, 100%); } #video::-webkit-media-controls-fullscreen-button { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header><span id="kind">Workspace Media</span><span id="status" role="status">Loading media…</span><span class="actions"><button id="refresh" title="Refresh media" aria-label="Refresh media">↻</button><button id="copy" title="Copy workspace path" aria-label="Copy workspace path">⧉</button></span></header>
    <div id="path"></div>
    <img id="image" alt="Workspace image"><video id="video" controls playsinline controlslist="nodownload noplaybackrate nofullscreen" disablepictureinpicture></video><audio id="audio" controls></audio>
  </main>
  <script src="media-viewer.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; } html, body { width: 100%; min-width: 0; height: auto; overflow: hidden; }
    body { margin: 0; color: CanvasText; background: Canvas; }
    .capture { width: 100%; padding: 20px 24px 26px; display: grid; gap: 10px; }
    .top-row, .path-row { display: flex; align-items: center; min-width: 0; }
    .top-row { flex-wrap: wrap; gap: 7px 9px; }
    .image-type { color: color-mix(in srgb, CanvasText 76%, Canvas); font-size: 14px; font-weight: 400; line-height: 1.3; }
    button { font: inherit; color: CanvasText; cursor: pointer; }.icon-button { display: inline-grid; width: 31px; height: 31px; flex: 0 0 auto; padding: 0; place-items: center; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 8px; background: color-mix(in srgb, CanvasText 5%, Canvas); }.icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }.icon-button .copy-icon { width: 20px; height: 20px; fill: currentColor; stroke: none; }.icon-button .refresh-icon { transform-origin: 50% 50%; transition: transform 160ms ease; }.icon-button.refreshing .refresh-icon { animation: refresh-turn 720ms linear infinite; }.icon-button:disabled { cursor: progress; opacity: .7; } @keyframes refresh-turn { to { transform: rotate(360deg); } }
    .details { display: none; min-width: 0; }.details.visible { display: block; }.path-row { gap: 8px; }.path { min-width: 0; flex: 1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }.youtube-video-link, .youtube-timestamp-link { color: #3b82f6; text-decoration: underline; text-underline-offset: 2px; }
    .status { display: none; min-width: 0; font-size: 13px; line-height: 1.3; color: color-mix(in srgb, CanvasText 66%, Canvas); }.status:not(:empty) { display: block; }.status.error { color: #d92d20; }.metadata { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 6px; }.chip { padding: 3px 7px; border: 1px solid color-mix(in srgb, CanvasText 17%, Canvas); border-radius: 999px; color: color-mix(in srgb, CanvasText 76%, Canvas); font-size: 11px; line-height: 1.25; }.actions { display: flex; gap: 7px; margin-left: auto; }

    #image, #video, #audio { display: none; max-width: 100%; border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas); border-radius: 10px; background: color-mix(in srgb, CanvasText 8%, Canvas); box-shadow: 0 1px 3px rgb(0 0 0 / 18%); }
    #image, #video { max-height: 560px; width: auto; height: auto; justify-self: start; } #audio { width: min(560px, 100%); } #video::-webkit-media-controls-fullscreen-button { display: none !important; }
  </style>
</head>
<body>
  <main class="capture">
    <header class="top-row"><span id="kind" class="image-type">Workspace Image</span><div id="status" class="status" role="status"></div><div id="metadata" class="metadata"></div><div class="actions"><button id="refresh" class="icon-button" type="button" title="Refresh media" aria-label="Refresh media"><svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(10 9)"><path d="M8 -1A8 8 0 1 0 10.2 4.5"></path><path d="M9 -6v7H2"></path></g></svg></button></div></header>
    <section id="details" class="details visible"><div class="path-row"><div id="path" class="path"></div><button id="copy" class="icon-button" type="button" title="Copy workspace path" aria-label="Copy workspace path"><svg aria-hidden="true" class="copy-icon" focusable="false" height="20" viewBox="0 0 20 20" width="20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M15.1006 1.78516C16.793 1.78556 18.165 3.15808 18.165 4.85059V10.8838C18.1649 12.5762 16.7929 13.9478 15.1006 13.9482H13.998V15.0508C13.9976 16.7431 12.626 18.1151 10.9336 18.1152H4.90039C3.20789 18.1152 1.83537 16.7432 1.83496 15.0508V9.01758C1.83496 7.32482 3.20764 5.95215 4.90039 5.95215H6.00195V4.85059C6.00195 3.15783 7.37463 1.78516 9.06738 1.78516H15.1006ZM4.90039 7.28223C3.94218 7.28223 3.16504 8.05936 3.16504 9.01758V15.0508C3.16544 16.0087 3.94243 16.7852 4.90039 16.7852H10.9336C11.8914 16.785 12.6676 16.0086 12.668 15.0508V9.01758C12.668 8.05945 11.8917 7.28237 10.9336 7.28223H4.90039ZM9.06738 3.11523C8.10917 3.11523 7.33203 3.89237 7.33203 4.85059V5.95215H10.9336C12.6262 5.95229 13.998 7.32491 13.998 9.01758V12.6182H15.1006C16.0584 12.6178 16.8348 11.8416 16.835 10.8838V4.85059C16.835 3.89262 16.0585 3.11564 15.1006 3.11523H9.06738Z" fill="currentColor"></path></svg></button></div></section>
    <img id="image" alt="Workspace image"><video id="video" controls preload="metadata" playsinline controlslist="nodownload noplaybackrate nofullscreen" disablepictureinpicture></video><audio id="audio" controls preload="metadata"></audio>
  </main>
  <script src="media-viewer.js"></script>
</body>
</html>

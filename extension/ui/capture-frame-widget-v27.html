<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; } html, body { width: 100%; min-width: 0; overflow: hidden; }
    body { margin: 0; color: CanvasText; background: transparent; }
    .capture { width: 100%; padding: 20px 24px 26px; display: grid; gap: 10px; }
    .top-row, .path-row { display: flex; align-items: center; min-width: 0; }
    .top-row { flex-wrap: wrap; gap: 7px 9px; }
    .image-type { color: color-mix(in srgb, CanvasText 76%, Canvas); font-size: 14px; font-weight: 400; line-height: 1.3; }
    button { font: inherit; color: CanvasText; cursor: pointer; }.icon-button { display: inline-grid; width: 31px; height: 31px; flex: 0 0 auto; padding: 0; place-items: center; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 8px; background: color-mix(in srgb, CanvasText 5%, Canvas); }.icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }.icon-button .refresh-icon { transform-origin: 50% 50%; transition: transform 160ms ease; }.icon-button.refreshing .refresh-icon { animation: refresh-turn 720ms linear infinite; }.icon-button:disabled { cursor: progress; opacity: .7; } @keyframes refresh-turn { to { transform: rotate(360deg); } }
    .details { display: none; min-width: 0; }.details.visible { display: block; }.path-row { gap: 8px; }.path { min-width: 0; flex: 1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }.youtube-video-link, .youtube-timestamp-link { color: #3b82f6; text-decoration: underline; text-underline-offset: 2px; }
    .status { display: none; min-width: 0; font-size: 13px; line-height: 1.3; color: color-mix(in srgb, CanvasText 66%, Canvas); }.status:not(:empty) { display: block; }.status.error { color: #d92d20; }.metadata { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 6px; }.chip { padding: 3px 7px; border: 1px solid color-mix(in srgb, CanvasText 17%, Canvas); border-radius: 999px; color: color-mix(in srgb, CanvasText 76%, Canvas); font-size: 11px; line-height: 1.25; }.actions { display: flex; gap: 7px; margin-left: auto; }
  </style>
</head>
<body>
  <main id="capture" class="capture">
    <header class="top-row"><span id="brand-context" class="image-type">Workspace Image</span><div id="status" class="status" role="status"></div><div id="metadata" class="metadata"></div><div class="actions"><button id="refresh-frame" class="icon-button" type="button" title="Refresh image" aria-label="Refresh image"><svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(10 9)"><path d="M8 -1A8 8 0 1 0 10.2 4.5"></path><path d="M9 -6v7H2"></path></g></svg></button></div></header>
    <section id="details" class="details"><div class="path-row"><div id="path" class="path"></div><button id="copy-frame-name" class="icon-button" type="button" title="Copy workspace path" aria-label="Copy workspace path"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(12 12)"><rect x="-5" y="-7" width="10" height="12" rx="1.5"/><path d="M-2 -5h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H-2a2 2 0 0 1-2-2"/></g></svg></button></div></section>
  </main>
  <script>
    (() => {
      const openai = () => window.openai; const root = document.getElementById("capture"); const status = document.getElementById("status"); const details = document.getElementById("details"); const pathElement = document.getElementById("path"); const metadata = document.getElementById("metadata"); const brandContext = document.getElementById("brand-context"); const refreshButton = document.getElementById("refresh-frame"); const copyButton = document.getElementById("copy-frame-name"); const WIDGET_SOURCE = "researchtube-capture-frame-widget"; const EXTENSION_BRIDGE_METHOD = "researchtube/extension-bridge"; const localActionRequests = new Map(); let lastWorkspacePath = null; let displayedWorkspacePath = null; let displayedMediaStats = null;
      const reportHeight = () => requestAnimationFrame(() => { try { openai()?.notifyIntrinsicHeight?.({ height: Math.ceil(document.documentElement.scrollHeight) }); } catch (_error) {} });
      const setStatus = (text, error = false) => { status.textContent = text; status.classList.toggle("error", error); reportHeight(); };
      function chatGptParentOrigin() { try { const origin = new URL(document.referrer).origin; return new URL(origin).hostname === "chatgpt.com" ? origin : "*"; } catch (_error) { return "*"; } }
      function postToTopExtensionBridge(type, params) { window.parent.postMessage({ jsonrpc: "2.0", method: EXTENSION_BRIDGE_METHOD, params: { source: WIDGET_SOURCE, type, ...params } }, chatGptParentOrigin()); }
      function notifyLocalMedia(viewer) { const { info } = viewer; const media = { workspacePath: info.workspacePath, mediaKind: info.mediaKind, mimeType: info.mimeType, sizeBytes: Number.isInteger(info.sizeBytes) ? info.sizeBytes : info.imageSizeBytes }; window.dispatchEvent(new CustomEvent("researchtube-local-media-ready", { detail: { media } })); postToTopExtensionBridge("local-media-ready", { media }); }
      function callLocalExtensionAction(action, path) { return new Promise((resolve, reject) => { const requestId = `rt_${Date.now()}_${Math.random().toString(36).slice(2)}`; const timeout = window.setTimeout(() => { localActionRequests.delete(requestId); reject(new Error("The local ResearchTube extension did not respond.")); }, 20_000); localActionRequests.set(requestId, { resolve, reject, timeout }); const request = { source: WIDGET_SOURCE, type: "local-action-request", requestId, action, path }; window.dispatchEvent(new CustomEvent("researchtube-local-action-request", { detail: request })); postToTopExtensionBridge("local-action-request", { requestId, action, path }); }); }
      async function copyWorkspacePath() { if (!displayedWorkspacePath) throw new Error("The workspace path is unavailable."); await callLocalExtensionAction("copyPath", displayedWorkspacePath); }
      function youtubeTagId(path) { return path.match(/(?:^| )\[yt_([A-Za-z0-9_-]{11})\](?= |$)/)?.[1] || null; }
      function renderPath(path) { const fragment = document.createDocumentFragment(); const videoId = youtubeTagId(path); const isPartial = /\[partial_\d+(?:\.\d+)?_\d+(?:\.\d+)?\]/.test(path); let cursor = 0; for (const match of path.matchAll(/\[yt_([A-Za-z0-9_-]{11})\]|\[t_(\d+(?:\.\d+)?)\]/g)) { fragment.append(document.createTextNode(path.slice(cursor, match.index))); const link = document.createElement("a"); if (match[1] && match[1] === videoId) { link.className = "youtube-video-link"; link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(match[1])}`; link.title = "Open source video on YouTube"; } else if (videoId && !isPartial) { const timestampSeconds = Number(match[2]); link.className = "youtube-timestamp-link"; link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}&t=${Math.max(0, Math.floor(timestampSeconds))}s`; link.title = `Open source video at ${timestampSeconds.toFixed(3)} seconds`; } else { fragment.append(document.createTextNode(match[0])); cursor = match.index + match[0].length; continue; } link.target = "_blank"; link.rel = "noreferrer"; link.textContent = match[0]; fragment.append(link); cursor = match.index + match[0].length; } fragment.append(document.createTextNode(path.slice(cursor))); pathElement.replaceChildren(fragment); }
      function addChip(text) { if (!text) return; const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = text; metadata.append(chip); }
      function workspaceFormatLabel(path, fallback) { const match = String(path || "").match(/\.([A-Za-z0-9]+)$/); return (match?.[1] || fallback || "").toUpperCase(); }
      function parseToolOutput(value) { if (typeof value !== "string") return value; try { return JSON.parse(value); } catch (_error) { return value; } }
      function viewerPayload(value) { value = parseToolOutput(value); if (!value || value.showInChat !== true) return null; const info = value.image && typeof value.image === "object" ? value.image : value; if (!info || typeof info.workspacePath !== "string" || typeof info.mimeType !== "string") return null; const mediaKind = info.mediaKind || "image"; if (!["image", "video", "audio"].includes(mediaKind)) return null; const kind = value.crop ? "crop" : Number.isInteger(value.monitorCount) ? "screenshot" : Number.isFinite(value.requestedTimestampSeconds) ? "frame" : "workspace"; return { value, info: { ...info, mediaKind }, kind }; }
      function hideWidget() { root.style.display = "none"; try { openai()?.notifyIntrinsicHeight?.({ height: 0 }); } catch (_error) {} }
      function cameraTaskTag(path) { return /(?:^| )\[cam_[A-Za-z0-9_-]{10}\](?= |\.|$)/.test(path); }
      function ttsTaskTag(path) { return /(?:^| )\[tts_[A-Za-z0-9_-]{10}\](?= |\.|$)/.test(path); }
      function waitForToolOutput() { root.style.display = "grid"; details.classList.remove("visible"); metadata.replaceChildren(); displayedMediaStats = null; brandContext.textContent = "Workspace Media"; setStatus("Waiting for media data…"); }
      function durationLabel(seconds) { if (!Number.isFinite(seconds) || seconds < 0) return null; const total = Math.floor(seconds); const minutes = Math.floor(total / 60); const remainder = total % 60; if (minutes < 60) return `${minutes}:${String(remainder).padStart(2, "0")}`; const hours = Math.floor(minutes / 60); return `${hours}:${String(minutes % 60).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`; }
      function showDetails(viewer) { const { value, info, kind } = viewer; displayedWorkspacePath = info.workspacePath; root.style.display = "grid"; root.style.minHeight = "620px"; const webcam = cameraTaskTag(info.workspacePath); const tts = ttsTaskTag(info.workspacePath); brandContext.textContent = tts ? "Speech TTS Audio" : webcam ? `Webcam ${info.mediaKind === "video" ? "Video" : info.mediaKind === "audio" ? "Audio" : "Frame"}` : kind === "frame" ? "Captured Frame" : kind === "screenshot" ? "Screenshot" : kind === "crop" ? "Cropped Image" : info.mediaKind === "video" ? "Workspace Video" : info.mediaKind === "audio" ? "Workspace Audio" : "Workspace Image"; if (kind === "frame" || kind === "crop" || youtubeTagId(info.workspacePath)) renderPath(info.workspacePath); else pathElement.textContent = info.workspacePath; metadata.replaceChildren(); if (kind === "frame" && Number.isFinite(value.requestedTimestampSeconds)) addChip(`t = ${value.requestedTimestampSeconds.toFixed(3)} s`); const width = displayedMediaStats?.width ?? info.width; const height = displayedMediaStats?.height ?? info.height; if (Number.isInteger(width) && Number.isInteger(height)) addChip(`${width} × ${height}`); addChip(workspaceFormatLabel(info.workspacePath, info.format || info.mimeType.split("/")[1])); const size = Number.isInteger(info.sizeBytes) ? info.sizeBytes : info.imageSizeBytes; if (Number.isInteger(size)) addChip(`${Math.round(size / 1024)} KB`); const duration = durationLabel(displayedMediaStats?.duration ?? info.durationSeconds); if (duration && info.mediaKind !== "image") addChip(duration); if (kind === "frame" && typeof value.seekMode === "string") addChip(`${value.seekMode} seek`); if (kind === "crop") addChip(`crop ${value.crop.x},${value.crop.y} ${value.crop.width}×${value.crop.height}`); if (kind === "screenshot") { addChip(`${value.monitorCount} monitor${value.monitorCount === 1 ? "" : "s"}`); if (value.virtualDesktop) addChip(`desktop ${value.virtualDesktop.left},${value.virtualDesktop.top}`); } details.classList.add("visible"); reportHeight(); }
      async function render(value, force = false) { value = parseToolOutput(value); if (value === undefined || value === null) { waitForToolOutput(); return; } const viewer = viewerPayload(value); if (!viewer) { hideWidget(); return; } const { info } = viewer; if (!force && info.workspacePath === lastWorkspacePath) return; lastWorkspacePath = info.workspacePath; displayedMediaStats = null; showDetails(viewer); setStatus("Loading local ResearchTube media…"); notifyLocalMedia(viewer); }
      const currentFrame = () => parseToolOutput(openai()?.toolOutput ?? openai()?.widgetState?.modelContent);
      function globalsToolOutput(globals) { return parseToolOutput(globals?.toolOutput ?? globals?.widgetState?.modelContent ?? currentFrame()); }
      refreshButton.addEventListener("click", async () => { refreshButton.disabled = true; refreshButton.classList.add("refreshing"); lastWorkspacePath = null; try { await render(currentFrame(), true); } finally { refreshButton.disabled = false; refreshButton.classList.remove("refreshing"); } });
      copyButton.addEventListener("click", async () => { if (!displayedWorkspacePath) return; copyButton.disabled = true; const originalTitle = copyButton.title; copyButton.title = "Copying workspace path"; try { await copyWorkspacePath(); copyButton.title = "Copied workspace path"; setStatus("Workspace path copied."); } catch (error) { copyButton.title = originalTitle; setStatus(error instanceof Error ? error.message : "Could not copy workspace path.", true); } finally { copyButton.disabled = false; window.setTimeout(() => { copyButton.title = originalTitle; }, 1400); } });
      window.addEventListener("openai:set_globals", event => void render(globalsToolOutput(event?.detail?.globals))); window.addEventListener("message", event => { if (event.source !== window.parent) return; if (event.data?.method === "ui/notifications/tool-result") void render(event.data.params?.structuredContent); }); window.addEventListener("researchtube-local-action-result", event => { const result = event.detail; const pending = localActionRequests.get(result?.requestId); if (!pending) return; localActionRequests.delete(result.requestId); clearTimeout(pending.timeout); if (result.ok) pending.resolve(result.data ?? null); else pending.reject(new Error(String(result.error || "The local ResearchTube action did not complete."))); });
      if (typeof ResizeObserver === "function") new ResizeObserver(reportHeight).observe(document.body); render(currentFrame());
      // ChatGPT can create the iframe before it publishes toolOutput. Polling is
      // limited to this short bootstrap window and prevents an initial blank card.
      for (let attempt = 1; attempt <= 24; attempt += 1) window.setTimeout(() => { const value = currentFrame(); if (value !== undefined && value !== null) void render(value); }, attempt * 250);
    })();
  </script>
</body>
</html>

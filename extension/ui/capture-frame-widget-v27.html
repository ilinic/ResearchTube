<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; } html, body { width: 100%; min-width: 0; overflow: hidden; }
    body { margin: 0; color: CanvasText; background: transparent; }
    .capture { width: 100%; padding: 20px 24px 26px; display: grid; gap: 10px; }
    .top-row, .path-row { display: flex; align-items: center; min-width: 0; }
    .top-row { flex-wrap: wrap; gap: 7px 9px; }
    .image-type { font-size: 14px; font-weight: 700; line-height: 1.3; }
    button { font: inherit; color: CanvasText; cursor: pointer; }.icon-button { display: inline-grid; width: 31px; height: 31px; flex: 0 0 auto; padding: 0; place-items: center; border: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); border-radius: 8px; background: color-mix(in srgb, CanvasText 5%, Canvas); }.icon-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }.icon-button .refresh-icon { transform-origin: 50% 50%; transition: transform 160ms ease; }.icon-button.refreshing .refresh-icon { animation: refresh-turn 720ms linear infinite; }.icon-button:disabled { cursor: progress; opacity: .7; } @keyframes refresh-turn { to { transform: rotate(360deg); } }
    .details { display: none; min-width: 0; }.details.visible { display: block; }.path-row { gap: 8px; }.path { min-width: 0; flex: 1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }.youtube-video-link, .youtube-timestamp-link { color: #3b82f6; text-decoration: underline; text-underline-offset: 2px; }
    .status { display: none; min-width: 0; font-size: 13px; line-height: 1.3; color: color-mix(in srgb, CanvasText 66%, Canvas); }.status:not(:empty) { display: block; }.status.error { color: #d92d20; }.metadata { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 6px; }.chip { padding: 3px 7px; border: 1px solid color-mix(in srgb, CanvasText 17%, Canvas); border-radius: 999px; color: color-mix(in srgb, CanvasText 76%, Canvas); font-size: 11px; line-height: 1.25; }.actions { display: flex; gap: 7px; margin-left: auto; }
    #image { display: none; max-width: 100%; max-height: 560px; width: auto; height: auto; border: 1px solid color-mix(in srgb, CanvasText 16%, Canvas); border-radius: 10px; background: color-mix(in srgb, CanvasText 8%, Canvas); box-shadow: 0 1px 3px rgb(0 0 0 / 18%); }
  </style>
</head>
<body>
  <main id="capture" class="capture">
    <header class="top-row"><span id="brand-context" class="image-type">Workspace Image</span><div id="status" class="status" role="status"></div><div id="metadata" class="metadata"></div><div class="actions"><button id="refresh-frame" class="icon-button" type="button" title="Refresh image" aria-label="Refresh image"><svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(10 9)"><path d="M8 -1A8 8 0 1 0 10.2 4.5"></path><path d="M9 -6v7H2"></path></g></svg></button></div></header>
    <section id="details" class="details"><div class="path-row"><div id="path" class="path"></div><button id="copy-frame-name" class="icon-button" type="button" title="Copy workspace path" aria-label="Copy workspace path"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(12 12)"><rect x="-5" y="-7" width="10" height="12" rx="1.5"/><path d="M-2 -5h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H-2a2 2 0 0 1-2-2"/></g></svg></button></div></section>
    <img id="image" alt="Workspace image">
  </main>
  <script>
    (() => {
      const openai = () => window.openai; const root = document.getElementById("capture"); const image = document.getElementById("image"); const status = document.getElementById("status"); const details = document.getElementById("details"); const pathElement = document.getElementById("path"); const metadata = document.getElementById("metadata"); const brandContext = document.getElementById("brand-context"); const refreshButton = document.getElementById("refresh-frame"); const copyButton = document.getElementById("copy-frame-name"); const LOCAL_AGENT_RETRY_DELAYS_MS = [0, 1000, 2000, 4000]; let lastWorkspacePath = null; let displayedWorkspacePath = null; let displayedLocalAgentImageUrl = null; let renderSequence = 0;
      const reportHeight = () => requestAnimationFrame(() => { try { openai()?.notifyIntrinsicHeight?.({ height: Math.ceil(document.documentElement.scrollHeight) }); } catch (_error) {} });
      const setStatus = (text, error = false) => { status.textContent = text; status.classList.toggle("error", error); reportHeight(); };
      const widgetMetadata = () => openai()?.toolResponseMetadata ?? null;
      function findLocalAgentImageUrl(value, visited = new Set()) { if (!value || typeof value !== "object" || visited.has(value)) return null; visited.add(value); if (typeof value.localAgentImageUrl === "string" && value.localAgentImageUrl.startsWith("http://127.0.0.1:")) return value.localAgentImageUrl; for (const nested of Object.values(value)) { const found = findLocalAgentImageUrl(nested, visited); if (found) return found; } return null; }
      async function callImageTool(path) { if (typeof openai()?.callTool !== "function") throw new Error("This ChatGPT host does not expose the MCP Apps tool-call bridge."); return openai().callTool("media_load_workspace_image", { path }); }
      async function copyWorkspacePath() { if (!displayedLocalAgentImageUrl) throw new Error("The Local Agent image URL is unavailable."); const response = await fetch(displayedLocalAgentImageUrl, { method: "POST", cache: "no-store" }); if (!response.ok) throw new Error("The Local Agent could not copy the workspace path."); const result = await response.json(); if (result?.success !== true) throw new Error("The Local Agent could not copy the workspace path."); }
      function youtubeTagId(path) { return path.match(/(?:^| )\[yt_([A-Za-z0-9_-]{11})\](?= |$)/)?.[1] || null; }
      function renderPath(path) { const fragment = document.createDocumentFragment(); const videoId = youtubeTagId(path); const isPartial = /\[partial_\d+(?:\.\d+)?_\d+(?:\.\d+)?\]/.test(path); let cursor = 0; for (const match of path.matchAll(/\[yt_([A-Za-z0-9_-]{11})\]|\[t_(\d+(?:\.\d+)?)\]/g)) { fragment.append(document.createTextNode(path.slice(cursor, match.index))); const link = document.createElement("a"); if (match[1] && match[1] === videoId) { link.className = "youtube-video-link"; link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(match[1])}`; link.title = "Open source video on YouTube"; } else if (videoId && !isPartial) { const timestampSeconds = Number(match[2]); link.className = "youtube-timestamp-link"; link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}&t=${Math.max(0, Math.floor(timestampSeconds))}s`; link.title = `Open source video at ${timestampSeconds.toFixed(3)} seconds`; } else { fragment.append(document.createTextNode(match[0])); cursor = match.index + match[0].length; continue; } link.target = "_blank"; link.rel = "noreferrer"; link.textContent = match[0]; fragment.append(link); cursor = match.index + match[0].length; } fragment.append(document.createTextNode(path.slice(cursor))); pathElement.replaceChildren(fragment); }
      function addChip(text) { if (!text) return; const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = text; metadata.append(chip); }
      function parseToolOutput(value) { if (typeof value !== "string") return value; try { return JSON.parse(value); } catch (_error) { return value; } }
      function viewerPayload(value) { value = parseToolOutput(value); if (!value || value.showInChat !== true) return null; const info = value.image && typeof value.image === "object" ? value.image : value; if (!info || typeof info.workspacePath !== "string" || typeof info.mimeType !== "string") return null; const kind = value.crop ? "crop" : Number.isInteger(value.monitorCount) ? "screenshot" : Number.isFinite(value.requestedTimestampSeconds) ? "frame" : "workspace"; return { value, info, kind }; }
      function hideWidget() { root.style.display = "none"; try { openai()?.notifyIntrinsicHeight?.({ height: 0 }); } catch (_error) {} }
      function waitForToolOutput() { root.style.display = "grid"; details.classList.remove("visible"); metadata.replaceChildren(); image.style.display = "none"; brandContext.textContent = "Workspace Image"; setStatus("Waiting for image data…"); }
      function showDetails(viewer) { const { value, info, kind } = viewer; displayedWorkspacePath = info.workspacePath; root.style.display = "grid"; brandContext.textContent = kind === "frame" ? "Captured Frame" : kind === "screenshot" ? "Screenshot" : kind === "crop" ? "Cropped Image" : "Workspace Image"; if (kind === "frame" || kind === "crop" || youtubeTagId(info.workspacePath)) renderPath(info.workspacePath); else pathElement.textContent = info.workspacePath; metadata.replaceChildren(); if (kind === "frame" && Number.isFinite(value.requestedTimestampSeconds)) addChip(`t = ${value.requestedTimestampSeconds.toFixed(3)} s`); if (Number.isInteger(info.width) && Number.isInteger(info.height)) addChip(`${info.width} × ${info.height}`); addChip(String(info.format || info.mimeType.split("/")[1] || "").toUpperCase()); if (Number.isInteger(info.imageSizeBytes)) addChip(`${Math.round(info.imageSizeBytes / 1024)} KB`); if (kind === "frame" && typeof value.seekMode === "string") addChip(`${value.seekMode} seek`); if (kind === "crop") addChip(`crop ${value.crop.x},${value.crop.y} ${value.crop.width}×${value.crop.height}`); if (kind === "screenshot") { addChip(`${value.monitorCount} monitor${value.monitorCount === 1 ? "" : "s"}`); if (value.virtualDesktop) addChip(`desktop ${value.virtualDesktop.left},${value.virtualDesktop.top}`); } details.classList.add("visible"); reportHeight(); }
      async function paintImage(source) { await new Promise((resolve, reject) => { image.onload = () => { image.onload = null; image.onerror = null; resolve(); }; image.onerror = () => { image.onload = null; image.onerror = null; reject(new Error("The workspace image could not be loaded.")); }; image.src = source; }); image.style.display = "block"; reportHeight(); }
      const wait = milliseconds => new Promise(resolve => window.setTimeout(resolve, milliseconds));
      function retryUrl(source, attempt) { if (attempt === 0) return source; const url = new URL(source); url.searchParams.set("retry", String(attempt)); return url.href; }
      async function paintLocalAgentImage(source, sequence) { let failure = null; for (let attempt = 0; attempt < LOCAL_AGENT_RETRY_DELAYS_MS.length; attempt += 1) { if (attempt > 0) { setStatus(`Local Agent is unavailable. Retrying (${attempt + 1}/${LOCAL_AGENT_RETRY_DELAYS_MS.length})…`); await wait(LOCAL_AGENT_RETRY_DELAYS_MS[attempt]); if (sequence !== renderSequence) return false; } try { await paintImage(retryUrl(source, attempt)); return true; } catch (error) { failure = error; } } throw failure || new Error("The Local Agent is unavailable."); }
      async function render(value, force = false) { value = parseToolOutput(value); if (value === undefined || value === null) { renderSequence += 1; waitForToolOutput(); return; } const viewer = viewerPayload(value); if (!viewer) { renderSequence += 1; hideWidget(); return; } const { info } = viewer; if (!force && info.workspacePath === lastWorkspacePath) return; lastWorkspacePath = info.workspacePath; const sequence = ++renderSequence; image.style.display = "none"; showDetails(viewer); setStatus("Loading image…"); try { const initialUrl = findLocalAgentImageUrl(widgetMetadata()); const response = initialUrl ? null : await callImageTool(info.workspacePath); const localAgentImageUrl = initialUrl ?? findLocalAgentImageUrl(response); if (!localAgentImageUrl) throw new Error("The Local Agent did not return an image URL to the widget."); displayedLocalAgentImageUrl = localAgentImageUrl; await paintLocalAgentImage(localAgentImageUrl, sequence); if (sequence !== renderSequence) return; setStatus(""); } catch (error) { if (sequence !== renderSequence) return; console.warn("[ResearchTube] workspace-image preview failed", error); setStatus("Local Agent is unavailable. Start it, then click Refresh image.", true); } }
      const currentFrame = () => parseToolOutput(openai()?.toolOutput ?? openai()?.widgetState?.modelContent);
      function globalsToolOutput(globals) { return parseToolOutput(globals?.toolOutput ?? globals?.widgetState?.modelContent ?? currentFrame()); }
      refreshButton.addEventListener("click", async () => { refreshButton.disabled = true; refreshButton.classList.add("refreshing"); lastWorkspacePath = null; try { await render(currentFrame(), true); } finally { refreshButton.disabled = false; refreshButton.classList.remove("refreshing"); } });
      copyButton.addEventListener("click", async () => { if (!displayedWorkspacePath) return; copyButton.disabled = true; const originalTitle = copyButton.title; copyButton.title = "Copying workspace path"; try { await copyWorkspacePath(); copyButton.title = "Copied workspace path"; setStatus("Workspace path copied."); } catch (error) { copyButton.title = originalTitle; setStatus(error instanceof Error ? error.message : "Could not copy workspace path.", true); } finally { copyButton.disabled = false; window.setTimeout(() => { copyButton.title = originalTitle; }, 1400); } });
      window.addEventListener("openai:set_globals", event => void render(globalsToolOutput(event?.detail?.globals))); window.addEventListener("message", event => { if (event.source === window.parent && event.data?.method === "ui/notifications/tool-result") void render(event.data.params?.structuredContent); });
      if (typeof ResizeObserver === "function") new ResizeObserver(reportHeight).observe(document.body); render(currentFrame());
      // ChatGPT can create the iframe before it publishes toolOutput. Polling is
      // limited to this short bootstrap window and prevents an initial blank card.
      for (let attempt = 1; attempt <= 24; attempt += 1) window.setTimeout(() => { const value = currentFrame(); if (value !== undefined && value !== null) void render(value); }, attempt * 250);
    })();
  </script>
</body>
</html>

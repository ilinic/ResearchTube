<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{height:32px;margin:0;padding:0;overflow:hidden;background:transparent;color:#374151;font:13px/20px system-ui,sans-serif;color-scheme:light dark}
body{display:flex;align-items:center;gap:8px;padding:0 8px;box-sizing:border-box;white-space:nowrap}
.brand{flex-shrink:0;font-weight:600}
#status{overflow:hidden;text-overflow:ellipsis;color:#6b7280}
@media(prefers-color-scheme:dark){html,body{color:#e5e7eb}#status{color:#9ca3af}}
</style></head>
<body><span class="brand">ResearchTube</span><span id="status" role="status">Adding files to chat…</span><div id="anchor" hidden></div>
<script>
(()=>{
  const SOURCE='researchtube-chat-target-widget';
  const anchor=document.getElementById('anchor');
  const status=document.getElementById('status');
  const HEIGHT=32;
  let deadline=Date.now()+30_000;
  let metadata=null, bound=false, stopped=false, bridgeReady=false, tornDown=false, timer=null;
  let taskHandles=new Set();
  const retired=new Set();
  const notify=(method,params)=>window.parent.postMessage({jsonrpc:'2.0',method,params},'*');
  function reportSize() {
    // Shared MCP Apps sizing, with the optional ChatGPT compatibility helper.
    if(bridgeReady) notify('ui/notifications/size-changed',{height:HEIGHT});
    try { window.openai?.notifyIntrinsicHeight?.(HEIGHT); } catch (_error) { /* optional helper */ }
  }
  // Read the documented canonical result wrappers, never ChatGPT page markup.
  function taskResult(value) {
    const candidates=[value,value?._meta,value?.call_tool_result?._meta,value?.mcp_tool_result?._meta,
      value?.call_tool_result?.result?._meta,value?.mcp_tool_result?.result?._meta];
    for(const candidate of candidates) {
      const item=candidate?.['researchtube/chatTarget'];
      const artifact=candidate?.['researchtube/artifactTask'];
      const context=candidate?.['researchtube/chatContext'];
      const validBinding=item && /^tsk_[A-Za-z0-9_-]{10}$/.test(item.taskId)
        && typeof item.bindingToken==='string' && /^[a-f0-9-]{36}$/.test(item.bindingToken);
      const validArtifact=artifact && /^tsk_[A-Za-z0-9_-]{10}$/.test(artifact.taskId)
        && typeof artifact.addToChat==='boolean';
      const validContext=context && /^tsk_[A-Za-z0-9_-]{10}$/.test(context.taskId) && ['working','completed','failed','cancelled'].includes(context.status);
      if(validBinding || validArtifact || validContext) return {binding:validBinding?item:null,artifact:validArtifact?artifact:null,context:validContext?context:null};
    }
    return null;
  }
  function consume(value) {
    if(tornDown) return false;
    const incoming=taskResult(value);
    if(!incoming) return false;
    const artifact=incoming.artifact;
    // The host may reuse one iframe for many tool calls. Reset only for a new
    // task; old globals and late acknowledgments must not revive earlier calls.
    const handles=[artifact?.taskId,incoming.binding?.taskId,incoming.context?.taskId].filter(Boolean);
    if(handles.some(key=>retired.has(key))) return true;
    if(!handles.some(key=>taskHandles.has(key))) {
      for(const key of taskHandles) retired.add(key);
      taskHandles=new Set();metadata=null;bound=false;stopped=false;
      deadline=Date.now()+30_000;
      anchor.removeAttribute('data-researchtube-chat-target');
      status.textContent='Adding files to chat…';
      startPolling();
    }
    for(const key of handles) taskHandles.add(key);
    if(incoming.binding) metadata=incoming.binding;
    if(incoming.context) {
      if(incoming.context.status==='working' && (bound || stopped)) return true;
      status.textContent='Connecting tab group…';
      if(incoming.context.status==='completed') {
        showGroup(incoming.context.group);bound=true;finish();return true;
      }
      if(incoming.context.status==='failed' || incoming.context.status==='cancelled') {
        status.textContent=incoming.context.status==='cancelled'?'Group connection cancelled.':incoming.context.error?.code==='BROWSER_GROUP_NOT_FOUND'?'Place this chat and the sites in one tab group.':'Unable to connect group. Check task status.';
        finish();return true;
      }
    }
    if(metadata?.mode==='group' && !bound && !stopped) status.textContent='Connecting tab group…';
    if(bound || stopped) return true;
    if(artifact && !artifact.addToChat) {
      status.textContent=typeof artifact.operationLabel==='string' && artifact.operationLabel.length<=160?artifact.operationLabel:(artifact.tool==='system_speech_speak'?'Synthesizing speech…':'Processing media task…');bound=true;finish();return true;
    }
    if(artifact)status.textContent=typeof artifact.operationLabel==='string' && artifact.operationLabel.length<=160?`${artifact.operationLabel} Then adding files to chat…`:'Processing media, then adding files to chat…';
    announce();
    return true;
  }
  function announce() {
    if(bound || stopped || !metadata) return;
    const detail={source:SOURCE,...metadata};
    anchor.setAttribute('data-researchtube-chat-target',JSON.stringify(detail));
    window.dispatchEvent(new CustomEvent('researchtube-chat-target-ready',{detail}));
    window.parent.postMessage(detail,'*');
  }
  function finish() {
    stopped=true;
    if(timer!==null) {clearInterval(timer);timer=null;}
    anchor.removeAttribute('data-researchtube-chat-target');reportSize();
  }
  function result(value) {
    if(!metadata || value?.source!==SOURCE || value.taskId!==metadata.taskId || bound || stopped) return;
    if(value.ok) {
      if(metadata.mode==='group') {
        const group=value.context?.group;
        if(value.context?.status!=='completed' || !Number.isSafeInteger(value.context?.chatTabId) || !group) return;
        showGroup(group);
      }
      bound=true;finish();
    }
    else if(value.errorCode) {
      // Authoritative task errors stop. A transport/reload failure can be
      // temporary, so retry it until the binding deadline instead.
      console.info(`[ResearchTube] Chat binding stopped: ${value.errorCode}`);
      status.textContent=metadata.mode==='group'?(value.errorCode==='BROWSER_GROUP_NOT_FOUND'?'Place this chat and the sites in one tab group.':'Unable to connect group. Check task status.'):'Unable to add files. Check task status.';
      finish();
    }
  }
  function showGroup(group) {
    if(!group || !Array.isArray(group.tabs)) {status.textContent='Group connected.';return;}
    const sites=group.tabs.filter(tab=>tab.role==='site').length;
    status.textContent=group.nextOffset!==null?`Group connected · ${group.totalTabs} tabs`:`Group connected · ${sites} sites, ${group.tabs.length-sites} chats`;
  }
  window.addEventListener('researchtube-chat-target-result',event=>result(event.detail));
  window.addEventListener('openai:set_globals',event=>{consume(event.detail?.globals?.toolResponseMetadata);reportSize();});
  const initId='researchtube-chat-target-initialize';
  window.addEventListener('message',event=>{
    if(event.source!==window.parent) return;
    const value=event.data;
    if(value?.source===SOURCE && value.type==='binding-result') {result(value);return;}
    if(value?.jsonrpc!=='2.0') return;
    if(value.id===initId && value.result) {bridgeReady=true;notify('ui/notifications/initialized',{});reportSize();}
    if(value.method==='ui/notifications/tool-result') {
      // Canonical notification wins over potentially stale compatibility globals.
      if(!consume(value.params)) consume(window.openai?.toolResponseMetadata);
    }
    if(value.method==='ui/notifications/host-context-changed') reportSize();
    if(value.method==='ui/notifications/tool-cancelled') {status.textContent=metadata?.mode==='group'?'Group connection cancelled.':'File upload cancelled.';finish();}
    if(value.method==='ui/resource-teardown') {tornDown=true;finish();window.parent.postMessage({jsonrpc:'2.0',id:value.id,result:{}},'*');}
  });
  window.parent.postMessage({jsonrpc:'2.0',id:initId,method:'ui/initialize',params:{appInfo:{name:'researchtube-chat-target',version:'2.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}},'*');
  function poll() {
    if(tornDown) {finish();return;}
    consume(window.openai?.toolResponseMetadata);
    if(bound || stopped) return;
    if(Date.now()>=deadline) {
      console.info('[ResearchTube] Chat binding timed out; task status contains the result.');
      status.textContent='Unable to identify this chat. Check task status.';
      finish();return;
    }
    announce();
  }
  function startPolling() {if(timer===null && !tornDown) timer=setInterval(poll,250);}
  reportSize();startPolling();consume(window.openai?.toolResponseMetadata);
})();
</script></body></html>

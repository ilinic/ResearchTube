<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    .details { display: none; min-width: 0; }.details.visible { display: block; }.path-row { gap: 8px; }.path { min-width: 0; flex: 1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; word-break: break-word; }.youtube-video-link, .youtube-timestamp-link { color: #3b82f6; text-decoration: underline; text-underline-offset: 2px; }

  </style>
</head>
<body>
  <main id="capture" class="capture" data-researchtube-media-widget="2.2.78">
    <header class="top-row"><span id="brand-context" class="image-type">Workspace Image</span><div id="status" class="status" role="status"></div><div id="metadata" class="metadata"></div><div class="actions"><button id="refresh-frame" class="icon-button" type="button" title="Refresh media" aria-label="Refresh media"><svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(10 9)"><path d="M8 -1A8 8 0 1 0 10.2 4.5"></path><path d="M9 -6v7H2"></path></g></svg></button></div></header>

  </main>
  <script>
    (() => {
      const openai = () => window.openai; const root = document.getElementById("capture"); const status = document.getElementById("status"); const details = document.getElementById("details"); const pathElement = document.getElementById("path"); const metadata = document.getElementById("metadata"); const brandContext = document.getElementById("brand-context"); const refreshButton = document.getElementById("refresh-frame"); const copyButton = document.getElementById("copy-frame-name"); const localActionRequests = new Map(); let lastWorkspacePath = null; let displayedWorkspacePath = null; let displayedMediaStats = null;
      let lastReportedHeight = null;

        // measuring our own card lets a previously tall slot shrink again.
        const height = root.style.display === "none" ? 0 : Math.ceil(root.getBoundingClientRect().height);

        try { openai()?.notifyIntrinsicHeight?.(height); } catch (_error) {}
        try { window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height } }, "*"); } catch (_error) {}
      };
      const setStatus = (text, error = false) => { status.textContent = text; status.classList.toggle("error", error); reportHeight(); };
      const IMAGE_HANDSHAKE_TIMEOUT_SECONDS = 10;
      const WIDGET_VERSION = "2.2.78";
      const mediaLog = (...args) => console.info(`[ResearchTube media widget ${WIDGET_VERSION}]`, ...args);

      function mediaReply(value) {

        mediaLog("connection result", { viewId: value.viewId, requestId: value.requestId, state: value.state, error: value.error || null });

          if (mediaAttempt.done) return;

          setStatus("Extension connected. Loading local media…");

          refreshButton.title = "Retry / Refresh media";

      function startMediaView(viewer) {
        if (mediaAttempt) { clearInterval(mediaAttempt.interval); clearTimeout(mediaAttempt.timer); }

        const attempt = mediaAttempt = { value, done: false, notifications: 0 };
        mediaLog("media attempt started", { viewId, requestId: value.requestId, workspacePath: value.media.workspacePath, timeoutSeconds: value.timeoutSeconds });
        const notify = () => {
          if (attempt !== mediaAttempt || attempt.done || Date.now() >= value.expiresAt) return;
          mediaLog("notifying Extension", { viewId, requestId: value.requestId, notification: ++attempt.notifications });
          root.setAttribute("data-researchtube-image-view", JSON.stringify(value));
          window.dispatchEvent(new CustomEvent("researchtube-image-view-ready", { detail: value }));
          window.parent.postMessage(value, "*");
        };

        attempt.timer = setTimeout(() => {
          if (attempt !== mediaAttempt || attempt.done) return;
          attempt.done = true; attempt.state = "error"; clearInterval(attempt.interval);
          setStatus("ResearchTube could not display this media. Click Retry.", true);
          refreshButton.title = "Retry media";

        }, value.timeoutSeconds * 1000);
        notify();
      }
      window.addEventListener("researchtube-image-view-result", event => mediaReply(event.detail));
      window.addEventListener("message", event => { if (event.source === window.parent) mediaReply(event.data); });
      window.addEventListener("pagehide", () => { if (mediaAttempt) { clearInterval(mediaAttempt.interval); clearTimeout(mediaAttempt.timer); } });
      function notifyLocalMedia(viewer) { startMediaView(viewer); }
      function mediaActionReply(value) {
        if (value?.source !== "researchtube-image-view" || value.type !== "action-result") return;
        const pending = localActionRequests.get(value.actionId);
        if (!pending || value.viewId !== pending.value?.viewId || value.requestId !== pending.value?.requestId) return;
        localActionRequests.delete(value.actionId); clearTimeout(pending.timeout); clearInterval(pending.interval);
        root.removeAttribute("data-researchtube-image-action");
        mediaLog("Copy result", { viewId: value.viewId, actionId: value.actionId, ok: value.ok, error: value.error || null });
        if (value.ok) pending.resolve(null); else pending.reject(new Error(String(value.error || "The workspace path could not be copied.")));
      }
      function copyMediaWidgetPath() {
        return new Promise((resolve, reject) => {
          const value = { ...mediaAttempt.value, type: "action-request", action: "copyPath", actionId: crypto.randomUUID(),
            expiresAt: Date.now() + configuredMediaTimeout * 1000, timeoutSeconds: configuredMediaTimeout };
          const pending = { value, resolve, reject, notifications: 0 };
          const notify = () => {
            if (localActionRequests.get(value.actionId) !== pending) return;
            mediaLog("Copy notifying Extension", { viewId: value.viewId, actionId: value.actionId, notification: ++pending.notifications });
            root.setAttribute("data-researchtube-image-action", JSON.stringify(value));
            window.dispatchEvent(new CustomEvent("researchtube-image-view-action", { detail: value }));
            window.parent.postMessage(value, "*");
          };

          pending.interval = setInterval(notify, 1000);
          pending.timeout = setTimeout(() => {
            localActionRequests.delete(value.actionId); clearInterval(pending.interval); root.removeAttribute("data-researchtube-image-action");
            mediaLog("Copy timed out", { viewId: value.viewId, actionId: value.actionId, notifications: pending.notifications });
            reject(new Error("The media widget did not receive an Extension response to Copy. See the browser console and retry."));
          }, configuredMediaTimeout * 1000);
          notify();
        });
      }
      window.addEventListener("researchtube-image-view-action-result", event => mediaActionReply(event.detail));
      window.addEventListener("message", event => { if (event.source === window.parent) mediaActionReply(event.data); });
      async function copyWorkspacePath() { if (!displayedWorkspacePath) throw new Error("The workspace path is unavailable."); if (!mediaAttempt || mediaAttempt.value.media.workspacePath !== displayedWorkspacePath) throw new Error("The media widget is not connected. Click Refresh first."); await copyMediaWidgetPath(); }
      function youtubeTagId(path) { return path.match(/(?:^| )\[yt_([A-Za-z0-9_-]{11})\](?= |$)/)?.[1] || null; }
      function renderPath(path) { const fragment = document.createDocumentFragment(); const videoId = youtubeTagId(path); const isPartial = /\[partial_\d+(?:\.\d+)?_\d+(?:\.\d+)?\]/.test(path); let cursor = 0; for (const match of path.matchAll(/\[yt_([A-Za-z0-9_-]{11})\]|\[t_(\d+(?:\.\d+)?)\]/g)) { fragment.append(document.createTextNode(path.slice(cursor, match.index))); const link = document.createElement("a"); if (match[1] && match[1] === videoId) { link.className = "youtube-video-link"; link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(match[1])}`; link.title = "Open source video on YouTube"; } else if (videoId && !isPartial) { const timestampSeconds = Number(match[2]); link.className = "youtube-timestamp-link"; link.href = `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}&t=${Math.max(0, Math.floor(timestampSeconds))}s`; link.title = `Open source video at ${timestampSeconds.toFixed(3)} seconds`; } else { fragment.append(document.createTextNode(match[0])); cursor = match.index + match[0].length; continue; } link.target = "_blank"; link.rel = "noreferrer"; link.textContent = match[0]; fragment.append(link); cursor = match.index + match[0].length; } fragment.append(document.createTextNode(path.slice(cursor))); pathElement.replaceChildren(fragment); }

      function workspaceFormatLabel(path, fallback) { const match = String(path || "").match(/\.([A-Za-z0-9]+)$/); return (match?.[1] || fallback || "").toUpperCase(); }

      function viewerPayload(value) { value = parseToolOutput(value); if (!value || value.showInChat !== true) return null; const info = value.image && typeof value.image === "object" ? value.image : value; if (!info || typeof info.workspacePath !== "string" || typeof info.mimeType !== "string") return null; const mediaKind = info.mediaKind || "image"; if (!["image", "video", "audio"].includes(mediaKind)) return null; const kind = value.crop ? "crop" : Number.isInteger(value.monitorCount) ? "screenshot" : Number.isFinite(value.requestedTimestampSeconds) ? "frame" : "workspace"; return { value, info: { ...info, mediaKind }, kind }; }

      function cameraTaskTag(path) { return /(?:^| )\[cam_[A-Za-z0-9_-]{10}\](?= |\.|$)/.test(path); }
      function ttsTaskTag(path) { return /(?:^| )\[tts_[A-Za-z0-9_-]{10}\](?= |\.|$)/.test(path); }
      function waitForToolOutput() { root.style.display = "grid"; details.classList.remove("visible"); metadata.replaceChildren(); displayedMediaStats = null; brandContext.textContent = "Workspace Media"; setStatus("Waiting for media data…"); }
      function durationLabel(seconds) { if (!Number.isFinite(seconds) || seconds < 0) return null; const total = Math.floor(seconds); const minutes = Math.floor(total / 60); const remainder = total % 60; if (minutes < 60) return `${minutes}:${String(remainder).padStart(2, "0")}`; const hours = Math.floor(minutes / 60); return `${hours}:${String(minutes % 60).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`; }
      function showDetails(viewer) { const { value, info, kind } = viewer; displayedWorkspacePath = info.workspacePath; root.style.display = "grid"; root.style.minHeight = "620px"; if (info.mediaKind === "image") root.style.minHeight = "320px"; const webcam = cameraTaskTag(info.workspacePath); const tts = ttsTaskTag(info.workspacePath); brandContext.textContent = tts ? "Speech TTS Audio" : webcam ? `Webcam ${info.mediaKind === "video" ? "Video" : info.mediaKind === "audio" ? "Audio" : "Frame"}` : kind === "frame" ? "Captured Frame" : kind === "screenshot" ? "Screenshot" : kind === "crop" ? "Cropped Image" : info.mediaKind === "video" ? "Workspace Video" : info.mediaKind === "audio" ? "Workspace Audio" : "Workspace Image"; if (kind === "frame" || kind === "crop" || youtubeTagId(info.workspacePath)) renderPath(info.workspacePath); else pathElement.textContent = info.workspacePath; metadata.replaceChildren(); if (kind === "frame" && Number.isFinite(value.requestedTimestampSeconds)) addChip(`t = ${value.requestedTimestampSeconds.toFixed(3)} s`); const width = displayedMediaStats?.width ?? info.width; const height = displayedMediaStats?.height ?? info.height; if (Number.isInteger(width) && Number.isInteger(height)) addChip(`${width} × ${height}`); addChip(workspaceFormatLabel(info.workspacePath, info.format || info.mimeType.split("/")[1])); const size = Number.isInteger(info.sizeBytes) ? info.sizeBytes : info.imageSizeBytes; if (Number.isInteger(size)) addChip(`${Math.round(size / 1024)} KB`); const duration = durationLabel(displayedMediaStats?.duration ?? info.durationSeconds); if (duration && info.mediaKind !== "image") addChip(duration); if (kind === "frame" && typeof value.seekMode === "string") addChip(`${value.seekMode} seek`); if (kind === "crop") addChip(`crop ${value.crop.x},${value.crop.y} ${value.crop.width}×${value.crop.height}`); if (kind === "screenshot") { addChip(`${value.monitorCount} monitor${value.monitorCount === 1 ? "" : "s"}`); if (value.virtualDesk       function presentationFor(viewer) {
        const { value, kind } = viewer;
        const tags = [];
        if (kind === "frame") {
          if (Number.isFinite(value.requestedTimestampSeconds)) tags.push(`t = ${value.requestedTimestampSeconds.toFixed(3)} s`);
          if (typeof value.seekMode === "string") tags.push(`${value.seekMode} seek`);
        }
        if (kind === "crop") tags.push(`crop ${value.crop.x},${value.crop.y} ${value.crop.width}×${value.crop.height}`);
        if (kind === "screenshot") {
          tags.push(`${value.monitorCount} monitor${value.monitorCount === 1 ? "" : "s"}`);
          if (value.virtualDesktop) tags.push(`desktop ${value.virtualDesktop.left},${value.virtualDesktop.top}`);
        }

      }
      async function render(value, force = false) { value = parseToolOutput(value); if (value === undefined || value === null) { waitForToolOutput(); return; } const viewer = viewerPayload(value); if (!viewer) { hideWidget(); return; } lastToolOutput = value; const { info } = viewer; if (!force && info.workspacePath === lastWorkspacePath) return; mediaLog("media data received", { workspacePath: info.workspacePath, mediaKind: info.mediaKind }); lastWorkspacePath = info.workspacePath; displayedMediaStats = null; showDetails(viewer); setStatus("Loading local ResearchTube media…"); notifyLocalMedia(viewer); }

      }
      const currentFrame = () => parseToolOutput(openai()?.toolOutput ?? openai()?.widgetState?.modelContent ?? lastToolOutput);
      function globalsToolOutput(globals) { return parseToolOutput(globals?.toolOutput ?? globals?.widgetState?.modelContent ?? currentFrame()); }
      refreshButton.addEventListener("click", async () => { refreshButton.disabled = true; refreshButton.classList.add("refreshing"); lastWorkspacePath = null; try { await safeRender(currentFrame(), true); } finally { refreshButton.disabled = false; refreshButton.classList.remove("refreshing"); } });
      copyButton.addEventListener("click", async () => { if (!displayedWorkspacePath) return; copyButton.disabled = true; const originalTitle = copyButton.title; copyButton.title = "Copying workspace path"; try { await copyWorkspacePath(); copyButton.title = "Copied workspace path"; setStatus("Workspace path copied."); } catch (error) { copyButton.title = originalTitle; setStatus(error instanceof Error ? error.message : "Could not copy workspace path.", true); } finally { copyButton.disabled = false; window.setTimeout(() => { copyButton.title = originalTitle; }, 1400); } });
      window.addEventListener("openai:set_globals", event => { consumeMediaSettings(event?.detail?.globals?.toolResponseMetadata); void safeRender(globalsToolOutput(event?.detail?.globals)); }); window.addEventListener("message", event => { if (event.source !== window.parent) return; if (event.data?.method === "ui/notifications/tool-result") { consumeMediaSettings(event.data.params); void safeRender(event.data.params?.structuredContent); } });

      window.addEventListener("message", event => {
        if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;

      window.parent.postMessage({ jsonrpc: "2.0", id: initializeId, method: "ui/initialize", params: {

    })();
  </script>
